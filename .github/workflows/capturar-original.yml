name: Finalizar e validar previa fiel Gaivota
on:
  push:
    branches:
      - previa-fiel-chat
    paths:
      - '.github/workflows/capturar-original.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: previa-fiel-chat
      - name: Preservar arquivos originais e preparar dados publicos independentes
        run: node migration/finalize.mjs
      - name: Registrar somente a previa sem alterar producao
        shell: bash
        run: |
          git config user.name 'Gaivota migration'
          git config user.email 'migration@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Finalizar copia fiel: arquivos originais, dados publicos e verificacao de integridade'
            git push origin HEAD:previa-fiel-chat
          fi
      - name: Preparar navegador para comparacao visual
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/qa-venv"
          "$RUNNER_TEMP/qa-venv/bin/pip" install playwright
          "$RUNNER_TEMP/qa-venv/bin/python" -m playwright install --with-deps chromium
      - name: Comparar original e previa em desktop e celular
        shell: bash
        run: '"$RUNNER_TEMP/qa-venv/bin/python" migration/visual_qa.py'
      - name: Guardar capturas de tela e resultados verificaveis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaivota-comparacao-visual
          path: ${{ runner.temp }}/gaivota-qa
          if-no-files-found: warn
          retention-days: 7
