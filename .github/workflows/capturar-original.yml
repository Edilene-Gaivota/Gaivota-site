name: Capturar interface original Gaivota
on:
  push:
    branches:
      - previa-fiel-chat
    paths:
      - '.github/workflows/capturar-original.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CF_PAGES_BRANCH: previa-fiel-chat
    steps:
      - uses: actions/checkout@v4
        with:
          ref: previa-fiel-chat
      - name: Capturar HTML estilos scripts e imagens originais
        run: node migration/capture.mjs
      - name: Registrar arquivos recuperados somente na previa
        shell: bash
        run: |
          git config user.name 'Gaivota migration'
          git config user.email 'migration@users.noreply.github.com'
          git add index.html blog assets '*.css' '*.js' __migration _headers robots.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Recuperar interface original sem redesenho - somente previa'
          git push origin HEAD:previa-fiel-chat
